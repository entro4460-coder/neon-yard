<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON YARD – 브라우저 온라인 FPS</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
</head>
<body>
<canvas id="game"></canvas>

<main id="menu">
  <section class="panel">
    <h1>NEON<br>YARD</h1>
    <p class="tag">설치 없이 바로 시작하는 온라인 총격전</p>
    <label for="nick">닉네임</label>
    <input id="nick" maxlength="16" autocomplete="off" placeholder="2~16자">
    <button id="play" disabled>PLAY</button>
    <p id="err" role="alert"></p>
    <div class="status"><span id="dot"></span><span id="stat">서버 확인 중…</span><span id="online"></span></div>
  </section>
  <section class="panel keys">
    <h2>조작법</h2>
    <dl>
      <dt>W A S D</dt><dd>이동</dd>
      <dt>Shift</dt><dd>달리기</dd>
      <dt>Space</dt><dd>점프</dd>
      <dt>마우스</dt><dd>시점 / 왼쪽 클릭 사격</dd>
      <dt>1 / 2 / 3</dt><dd>소총 / 권총 / 칼 전환</dd>
      <dt>R</dt><dd>재장전</dd>
      <dt>Tab</dt><dd>킬보드</dd>
      <dt>Esc</dt><dd>마우스 해제</dd>
    </dl>
    <p class="note">Chrome / Edge 데스크톱 권장. 헤드샷은 2배 피해.</p>
  </section>
</main>

<div id="loading" class="overlay hidden"><div>접속 중…</div></div>
<div id="paused" class="overlay hidden"><div>클릭해서 게임으로 돌아가기<small>Esc로 마우스가 해제되었습니다</small></div></div>
<div id="lost" class="overlay hidden"><div><span id="lostmsg">서버와 연결이 끊어졌습니다</span><button id="retry">다시 접속</button></div></div>

<div id="hud" class="hidden">
  <div id="cross"></div><div id="hitm"></div><div id="hurtDir"></div><div id="vig"></div>
  <div id="feed"></div>
  <div id="stats"><b id="hp">100</b><i>HP</i><span id="ammo">30 / 120</span></div>
  <div id="weaponhud"><span class="weapon-slot active" data-slot="rifle">1 <b>RIFLE</b></span><span class="weapon-slot" data-slot="pistol">2 <b>PISTOL</b></span><span class="weapon-slot" data-slot="knife">3 <b>KNIFE</b></span></div>
  <div id="myk"></div>
  <div id="dead" class="hidden">사망 — 곧 리스폰합니다</div>
  <table id="board" class="hidden"></table>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
